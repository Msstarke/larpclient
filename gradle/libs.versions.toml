[versions]
kotlin = "2.1.0"
fabric-loom = "1.9-SNAPSHOT"
fabric-api = "0.112.0+1.21.4"
fabric-loader = "0.16.10"
fabric-kotlin = "1.13.0+kotlin.2.1.0"
moulconfig = "4.4.0-beta.3"
libautoupdate = "1.3.1"
shadow = "8.3.5"

[libraries]
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-kotlin" }
moulconfig-modern = { module = "org.notenoughupdates.moulconfig:modern-fabric", version.ref = "moulconfig" }
moulconfig-common = { module = "org.notenoughupdates.moulconfig:common", version.ref = "moulconfig" }
libautoupdate = { module = "moe.nea:libautoupdate", version.ref = "libautoupdate" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
